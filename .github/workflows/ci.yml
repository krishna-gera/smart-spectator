name: Smart Spectator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          APP_ENV: testing
          JWT_SECRET: test-secret-key-12345
        run: |
          pytest backend/tests/ -v

  mobile-test:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run Flutter analyzer
        working-directory: apps/mobile
        run: flutter analyze lib test

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

  web-build:
    name: Web Apps Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/web-dashboard/package.json
            apps/web-mobile/package.json

      - name: Build Web Dashboard
        working-directory: apps/web-dashboard
        run: |
          npm ci || npm install
          npm run build

      - name: Build Web Mobile PWA
        working-directory: apps/web-mobile
        run: |
          npm ci || npm install
          npm run build
