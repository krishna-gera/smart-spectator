name: Smart Spectator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8

      - name: Code Quality & Lint Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=apps/camera

      - name: Run Test Suite (Phases 1-7)
        env:
          SMART_SPECTATOR_ENV: test
          PYTHONPATH: .
        run: |
          pytest -v tests/

      - name: Security & Secret Scan Verification
        run: |
          # Verify no committed private keys or active credentials
          ! grep -rn "PRIVATE KEY" services/ shared/ ai/ apps/client/
          ! grep -rn "ss_tok_v1_" services/hub_backend/config.py
