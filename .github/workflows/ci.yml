name: VYRO CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: VYRO app (Flutter) — analyze, test, Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/camera
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      # AI features are enabled only when the repository has the AI service
      # settings (vars.AI_PROXY_URL / secrets.AI_PROXY_TOKEN); otherwise the
      # APK is built with AI turned off.
      - name: Build Android APK
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}
          AI_PROXY_TOKEN: ${{ secrets.AI_PROXY_TOKEN }}
        run: |
          flutter build apk --release \
            --dart-define=AI_PROXY_URL="$AI_PROXY_URL" \
            --dart-define=AI_PROXY_TOKEN="$AI_PROXY_TOKEN"
          cp build/app/outputs/flutter-apk/app-release.apk build/vyro-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vyro-android-apk
          path: apps/camera/build/vyro-android.apk
          retention-days: 14

  ai-service:
    name: VYRO AI service (Cloudflare Worker) — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai_proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/ai_proxy/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  website:
    name: VYRO website (Vercel) — links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check pages, links and assets
        run: node scripts/check_website.mjs apps/website

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: |
          if git ls-files | grep -E '(^|/)\.(dev\.vars|env)$'; then echo "::error::A secrets file is committed"; exit 1; fi
          if git grep -nE 'gsk_[A-Za-z0-9]{20,}|xai-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!**/package-lock.json'; then
            echo "::error::Something that looks like an API key or private key is committed"; exit 1
          fi
