# Cloudflare Worker for the Smart Spectator AI proxy.
# Deploy:   npx wrangler deploy
# Secrets:  npx wrangler secret put AI_API        (Groq API key)
#           npx wrangler secret put PROXY_TOKEN
# Never put secrets in this file; local secrets live in .dev.vars (git-ignored).
name = "smart-spectator-ai-proxy"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
AI_PROVIDER = "groq"
AI_MODEL = "qwen/qwen3.8-27b"
DAILY_REQUEST_LIMIT = "300"
PER_CAMERA_MIN_INTERVAL_SECONDS = "20"
# Web pages allowed to look up a main phone by its dashboard code.
ALLOWED_ORIGINS = "https://smart-vyro.vercel.app,http://localhost:5173,http://127.0.0.1:5173"

# Main-phone directory: the web apps find a main phone by its dashboard code.
[[kv_namespaces]]
binding = "HUBS"
id = "1a2254901261477089f8d2ffc3ba40b7"

# Rate limit for the directory (lookups and registrations, per visitor IP),
# shared across Cloudflare locations. namespace_id is any number unique to
# this account.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
